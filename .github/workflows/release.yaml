name: (▶) Create Release

on: workflow_dispatch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Prepare Release
        run: |

          git config --global user.email opensource@sitepark.com
          git config --global user.name sitepark-bot

          pnpm install
          pnpm build

          RELEASE_VERSION=$(dist/cli.js releaseVersion)

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |

          echo "Release Version $RELEASE_VERSION"

          dist/cli.js release --package-manager pnpm

          gh workflow run create-github-release.yml --ref $RELEASE_VERSION
